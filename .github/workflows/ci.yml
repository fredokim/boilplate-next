name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # These three are in `check:ci` and were not in this workflow, so the
      # token gate and the generator gate -- the two things plan items 1 and 2
      # exist to enforce -- never ran on a pull request. A gate nobody runs is
      # a gate that does not exist.
      - run: npm run check:tokens
      # Fails when a document names an npm script or a repository path that does
      # not exist. The README described a server directory that had moved to its
      # own repository for weeks, and nothing noticed.
      - run: npm run check:docs
      - run: npm run check:env
      - run: npm run lint
      - run: npm run typecheck
      # The coverage variant runs the same tests and then enforces the
      # thresholds. Running both would run every test twice for nothing.
      - run: npm run test:coverage
      # Two directions: what the route handlers forward must exist on the
      # backend, and what the client calls must be answered here.
      - run: npm run check:contract
      - run: npm run check:automation
      - run: npm run check:generators
      - run: npm run check:deps
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run build-storybook
      # Lighthouse. Accessibility and best-practices are asserted as errors;
      # performance stays a warning because it is wall-clock timing on a
      # shared runner. Every assertion used to be a warning, which meant the
      # run could not fail -- and it was never in this workflow at all, so
      # nothing noticed that it was auditing a build that refuses to boot.
      - run: npm run perf:lighthouse
      # The e2e suite existed and CI never ran it. In the Vue boilerplate the
      # same omission hid a router name collision that left the first page a
      # user sees completely blank, with every other gate green throughout:
      # unit tests render components in isolation and cannot see a navigation
      # that never settles.
      #
      # The config pinned `channel: msedge`, which no Linux runner has. It now
      # falls back to the Chromium Playwright installs, as the other two do.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Production dependencies only. The remaining dev-tree advisory is image-size,
      # reached through @storybook/nextjs-vite, and it has no upstream fix.
      - run: npm audit --omit=dev --audit-level=moderate
