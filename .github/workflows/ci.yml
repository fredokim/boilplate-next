name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A gate needs a browser. Installed before `release`, because the e2e gate
      # reports itself skipped without one and a skipped gate proves nothing.
      - run: npx playwright install --with-deps chromium

      # Every gate, from `scripts/release.ts`, which is the same list
      # `npm run release` runs locally. This used to be fourteen separate steps
      # here and a thirteen-command `&&` chain in package.json, and the two had
      # already drifted: `check:tokens`, `check:docs` and `check:generators` were
      # in the chain and not in this workflow, so the token gate and the
      # generator gate never ran on a pull request at all.
      #
      # The runner groups each gate's output for the log and prints a summary
      # naming every gate that failed, rather than stopping at the first one.
      - run: npm run release

      # Lighthouse stays its own step. Accessibility and best-practices are
      # asserted as errors; performance stays a warning because it is wall-clock
      # timing on a shared runner, and a gate that fails on runner noise is one
      # people learn to re-run rather than read.
      - run: npm run perf:lighthouse
      # Production dependencies only. The remaining dev-tree advisory is image-size,
      # reached through @storybook/nextjs-vite, and it has no upstream fix.

  runtime:
    # React and Vue ship a Dockerfile and their CI boots the image. This one
    # deploys on Render's Node runtime instead — `npm ci && npm run build`, then
    # `npm run start` — so the equivalent question is whether that command
    # actually serves the application, and until now nothing asked it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stand up a stub backend for the route handlers to forward to
        run: |
          mkdir -p /tmp/stub/api/health
          printf '{"success":true,"data":{"status":"stub-upstream"}}' > /tmp/stub/api/health/index.json
          docker run -d --name upstream -p 9099:80 -v /tmp/stub:/usr/share/nginx/html:ro nginx:alpine

      - run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:9099
          NEXT_PUBLIC_DATA_MODE: server

      - name: Serve the app and check the route handlers forward
        env:
          BACKEND_URL: http://127.0.0.1:9099
          NEXT_PUBLIC_DATA_MODE: server
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 1
          done

          echo "--- the app is served ---"
          curl -fsS http://127.0.0.1:3000/ > /dev/null             || { echo "the root route is not being served"; exit 1; }

          echo "--- this app's own health route answers ---"
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'             || { echo "/api/health did not answer"; exit 1; }

          echo "--- the browser never needs the backend's address ---"
          # BACKEND_URL has no NEXT_PUBLIC_ prefix, so it must not appear in
          # anything the browser downloads. ADR 0007 is why.
          if grep -rq "127.0.0.1:9099" .next/static; then
            echo "the backend address was inlined into the client bundle"
            exit 1
          fi

          docker rm -f upstream
